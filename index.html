<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Ada pesan yang mau Aku tulis buat Kamu." />
  <meta name="robots" content="noindex, nofollow" />
  <title>Untuk Kamu</title>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ada pesan buat Kamu" />
  <meta property="og:description" content="Aku tulis sesuatu. Baca pelan-pelan ya." />
  <meta name="twitter:card" content="summary" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300a884'/%3E%3Cpath d='M16 24.5S8 19 8 13.6A4.6 4.6 0 0116 11a4.6 4.6 0 018 2.6c0 5.4-8 10.9-8 10.9z' fill='%23ffffff'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <div class="app" id="app">
    <div class="wallpaper" id="wallpaper"></div>

    <section class="scene active" id="scene-lock" aria-label="Verifikasi dua langkah">
      <div class="v2-body" id="v2Body">
        <div class="v2-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><rect x="9" y="10.5" width="6" height="5" rx="1.4"/><path d="M10.5 10.5V9.6a1.5 1.5 0 0 1 3 0v.9"/></svg>
        </div>
        <h2>Verifikasi 2 Langkah</h2>
        <p id="lockSub">Masukkan kode 6 digit untuk membuka pesan.</p>
      </div>

      <div class="lock-bottom" id="lockBottom">
        <div class="pin-dots" id="pinDots" aria-hidden="true"></div>
        <p class="lock-msg" id="lockMsg" role="status"></p>
        <div class="keypad" id="keypad">
          <button class="key" data-key="1">1</button>
          <button class="key" data-key="2">2</button>
          <button class="key" data-key="3">3</button>
          <button class="key" data-key="4">4</button>
          <button class="key" data-key="5">5</button>
          <button class="key" data-key="6">6</button>
          <button class="key" data-key="7">7</button>
          <button class="key" data-key="8">8</button>
          <button class="key" data-key="9">9</button>
          <span class="key-empty"></span>
          <button class="key" data-key="0">0</button>
          <button class="key ghost" data-key="del" aria-label="Hapus angka terakhir">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m15 9-4 6M11 9l4 6"/></svg>
          </button>
        </div>
        <button class="v2-forgot" id="forgotBtn" type="button">Lupa kode?</button>
      </div>
    </section>

    <section class="scene" id="scene-confirm" aria-label="Konfirmasi">
      <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="cTitle" tabindex="-1">
        <div class="dialog-text">
          <div class="dlg-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1l8.8 8.8 8.8-8.8a5 5 0 0 0 0-7.1z"/></svg>
          </div>
          <h2 id="cTitle">Yakin mau lanjut?</h2>
          <p>Setelah ini nggak bisa mundur lagi, lho.</p>
        </div>
        <div class="dlg-actions">
          <div class="no-slot" id="noSlot"><button class="dlg-btn" id="noBtn" type="button">Tidak</button></div>
          <button class="dlg-btn primary" id="yesBtn" type="button">Ya, lanjut</button>
        </div>
      </div>
    </section>

    <section class="scene" id="scene-list" aria-label="Daftar chat">
      <div class="list-head"><h1>Chat</h1></div>
      <button class="list-row" id="openChat">
        <span class="avatar" data-avatar></span>
        <span class="list-main">
          <span class="list-name" data-sender></span><br>
          <span class="list-preview" id="listPreview"></span>
        </span>
        <span class="list-side">
          <span class="list-time" id="listTime"></span>
          <span class="badge">1</span>
        </span>
      </button>
      <p class="list-hint">Ketuk chat untuk membuka pesannya.</p>
    </section>

    <section class="scene" id="scene-chat" aria-label="Percakapan">
      <header class="chat-head">
        <span class="avatar" data-avatar></span>
        <div class="head-text">
          <div class="head-name" data-sender></div>
          <div class="head-status" id="status">online</div>
        </div>
        <button class="icon-btn" id="musicBtn" aria-pressed="true" aria-label="Musik" title="Musik">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="16.5" cy="16" r="2.6"/><path class="slash" d="M3 3l18 18"/></svg>
        </button>
        <button class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="Suara notifikasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="slash" d="M3 3l18 18"/></svg>
        </button>
      </header>
      <div class="messages" id="messages" role="log" aria-live="polite"></div>
      <footer class="footer">
        <button class="composer" id="composer" type="button" aria-label="Kirim pesan otomatis">
          <span class="field">
            <svg class="ic plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <svg class="ic sticker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.3 1.8 3.5 1.8 3.5-1.8 3.5-1.8"/><path d="M9 9.5h.01M15 9.5h.01"/></svg>
            <span class="ph">
              <i class="caret" aria-hidden="true"></i>
              <span class="txt" id="composerText">Type a message</span>
            </span>
            <span class="adv-end">
              <svg class="ic mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
              <span class="adv-send" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 8 6 8z"/></svg>
              </span>
            </span>
          </span>
        </button>
        <div class="chips" id="chips" hidden></div>
      </footer>
    </section>

    <div class="lightbox" id="lightbox" role="dialog" aria-label="Foto">
      <button class="icon-btn lb-close" id="lbClose" aria-label="Tutup foto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <button class="lb-nav prev" id="lbPrev" type="button" aria-label="Foto sebelumnya">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="lb-track" id="lbTrack"></div>
      <button class="lb-nav next" id="lbNext" type="button" aria-label="Foto berikutnya">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <div class="lb-bar">
        <span class="lb-cap" id="lbCap"></span>
        <span class="lb-count" id="lbCount"></span>
      </div>
      <p class="lb-hint">klik di luar foto untuk menutup &nbsp;·&nbsp; Esc</p>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/lock.js"></script>
  <script src="assets/js/chat.js"></script>
  <script src="assets/js/music.js"></script>
  <script src="assets/js/lightbox.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
